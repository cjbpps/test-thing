<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PaperFlip</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="pf-header">
    <div class="pf-brand">
      <span class="pf-brand-mark">PF</span>
      <span class="pf-brand-name">PaperFlip</span>
    </div>
    <span class="pf-badge-sim">SIM</span>
  </header>

  <section class="pf-balance-card">
    <div class="pf-balance-row">
      <div class="pf-balance-block">
        <span class="pf-label">Virtual Balance</span>
        <span class="pf-balance" id="balance">◎0.000</span>
        <span class="pf-balance-usd-sub" id="balance-usd-sub"></span>
      </div>
      <div class="pf-balance-block pf-align-right">
        <span class="pf-label">Total PnL (all-time)</span>
        <span class="pf-pnl" id="total-pnl">$0.00</span>
        <span class="pf-pnl-pct" id="total-pnl-pct">0.00%</span>
      </div>
    </div>
  </section>

  <section class="pf-positions">
    <div class="pf-section-head">
      <span>Open Positions</span>
      <span class="pf-count" id="positions-count">0</span>
    </div>
    <div id="positions-list" class="pf-positions-list">
      <p class="pf-empty" id="positions-empty">No open positions. Head to a supported terminal to start paper trading.</p>
    </div>
  </section>

  <section class="pf-quick-trade" id="quick-trade" hidden>
    <div class="pf-section-head"><span>Quick Trade (this tab's token)</span></div>
    <div class="pf-quick-trade-row">
      <span id="quick-symbol" class="pf-quick-symbol">—</span>
      <span id="quick-price" class="pf-quick-price">$0.00</span>
    </div>
    <div class="pf-preset-row" id="quick-presets">
      <button class="pf-btn pf-btn-preset" data-sol="0.1">0.1</button>
      <button class="pf-btn pf-btn-preset" data-sol="0.5">0.5</button>
      <button class="pf-btn pf-btn-preset" data-sol="1">1</button>
      <button class="pf-btn pf-btn-preset" data-sol="5">5</button>
    </div>
    <div class="pf-quick-trade-row">
      <input type="number" id="quick-amount" class="pf-input" placeholder="Custom SOL amount" min="0" step="0.01" />
      <button id="quick-buy" class="pf-btn pf-btn-buy">Buy</button>
    </div>
  </section>

  <section class="pf-wallet-panel" id="wallet-panel" hidden>
    <div class="pf-section-head"><span>Wallet Manager</span></div>
    <div class="pf-wallet-current-row">
      <span class="pf-label">Current</span>
      <span id="wallet-current" class="pf-wallet-current-value">$10,000.00</span>
    </div>
    <span id="wallet-sol-sub" class="pf-wallet-sol-sub"></span>
    <div class="pf-quick-trade-row">
      <input type="number" id="wallet-amount" class="pf-input" placeholder="Amount" min="0" step="0.01" />
      <select id="wallet-unit" class="pf-select">
        <option value="sol">SOL</option>
        <option value="usd">USD</option>
      </select>
    </div>
    <span id="wallet-preview" class="pf-wallet-preview"></span>
    <button id="wallet-apply" class="pf-btn pf-btn-primary">Set Balance (resets history)</button>
    <button id="wallet-quick-reset" class="pf-btn pf-btn-ghost">Quick Reset (same balance)</button>
  </section>

  <footer class="pf-footer">
    <button id="view-stats" class="pf-btn pf-btn-primary">View Full Stats</button>
    <button id="wallet-toggle" class="pf-btn pf-btn-ghost">💰 Wallet</button>
  </footer>

  <script src="../lib/storage.js"></script>
  <script src="../lib/price-api.js"></script>
  <script src="../lib/stats-calculations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
